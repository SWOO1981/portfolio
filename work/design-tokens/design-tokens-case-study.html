<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens Case Study - Steven Woo</title>
    <link rel="icon" type="image/x-icon" href="../../resources/ico/favicon.ico">
    <link rel="stylesheet" href="../resources/case-study-styles.css">
    <link rel="stylesheet" href="../../resources/styles.css">
    <link rel="stylesheet" href="resources/styles-design-tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
        rel="stylesheet">
</head>

<body class="cs-design-tokens">

    <!--------------------------------------->
    <!-- ///// ///// NAVIGATION ///// /////-->
    <!--------------------------------------->

    <header id="top" class="site-header">
        <div class="nav-wrapper">
            <a href="../../index.html"><img class="logo-woo" src="../../resources/images/img-logo-woo.svg"></a>

            <!-- Mobile menu button -->
            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
                ☰
            </button>

            <!-- Navigation links -->
            <nav id="primary-nav" class="nav-links">
                <a href="../../index.html#services">Services</a>
                <a href="../../index.html#work">Work</a>
                <a href="../../index.html#meet-steven">Meet Steven</a>
                <a href="../../index.html#get-in-touch">Get in Touch</a>
            </nav>
        </div>
    </header>

    <!------------------------------------->
    <!-- ///// CASE STUDY TEMPLATE ///// -->
    <!------------------------------------->

    <div id="case-study-container"></div>
    <script id="case-study-template" type="text/template">

    <!---------------------->
    <!-- ///// HERO ///// -->
    <!---------------------->
    <section class="hero-cs">
        <div class="hero-container">
            <h1>{{title}}</h1>
            <p class="subtitle">{{subtitle}}</p>
        </div>
    </section>

    <!------------------------------->
    <!-- ///// NEUE OVERVIEW ///// -->
    <!------------------------------->

    <section>
        <div class="project-info">
            <div class="project-details">
                
                <div class="item-1">
                    <!-- <h4>Company</h4> -->
                    <p>{{company}}</p>
                </div>
                
                <div class="item-2">
                    <!-- <h4>Role</h4> -->
                    <p>{{role}}</p>
                </div>

                <div class="item-3">
                    <!-- <h4>Scope</h4> -->
                    <p>{{platforms}}</p>
                </div>

                <div class="item-4">
                    <!-- <h4>Timeline</h4> -->
                    <p>{{timeline}}</p>
                </div>
            </div>
        </div>

        
    </section>

    <!------------------------------>
    <!-- ///// BODY CONTENT ///// -->
    <!------------------------------>

    
        
    <section class="canvas">

        {{bodyContent}}

    </section>

    <div class="canvas">
        <div class="bottom-nav content-center">
            <div class="hero-content content">
                <h3 class="title">Available For Hire</h3>
                    <p class="bricolage-grotesque-display-sub">Ready to level up your next project? Let's talk.</p>
                    
                <div class="poop">
                    <div class="chip-email">
                        <p class="card-title" id="email-text">steven@stevenwoo.com</p>
                        <button type="button" id="copy-email-btn">Copy</button>
                    </div>
                </div>
                
                <a href="../../index.html#work"><button type="button">Return to Work</button></a>

                <a href="#top"><button type="button">Back to Top</button></a>

            </div>
        </div>
    </div>     

    <footer>
        <div class="content-center">
            <p>&copy; Copyright – Steven WOO! All rights reserved. Version 6.0
            </p>
        </div>
    </footer>

    </script>


    <!--------------------->
    <!-- ///// END ///// -->
    <!--------------------->

    <script src="resources/data-design-tokens.js"></script>
    <script src="../resources/case-study-renderer.js"></script>
    <script src="../../resources/navigation.js"></script>
</body>

</html>
